# ============================================
# Docker Compose Override — Local Development
# ============================================
# Auto-merged with docker-compose.yml on `docker compose up`
# Exposes ports, enables hot-reload, mounts source code

services:
  # ── PostgreSQL — expose to host ────────────────
  postgres:
    ports:
      - "5432:5432"

  # ── Redis — expose to host ────────────────────
  redis:
    ports:
      - "6379:6379"

  # ── Backend — hot reload + source mount ───────
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"

  # ── Worker — hot reload + source mount ────────
  worker:
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    command: celery -A app.workers.celery_app worker -l info -c 2 -Q default,high_priority,celery

  # ── Frontend — production build (for dev hot-reload, use `make dev` which
  #    builds the dev image via Dockerfile.dev target) ──────────────────
  frontend:
    ports:
      - "3000:3000"

  # ── Nginx — expose to host ────────────────────
  nginx:
    ports:
      - "80:80"

volumes:
  storage_data:
