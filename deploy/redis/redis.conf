# ============================================
# Redis Production Configuration
# ============================================
# Reference: https://redis.io/docs/operate/oss_and_stack/management/configuration/

# ── Network ────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
requirepass CHANGE_ME_REDIS_PASSWORD

# ── Memory ─────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence ────────────────────────────────
# AOF (Append-Only File) for durability
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots (backup)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ── Performance ────────────────────────────────
tcp-backlog 511
tcp-keepalive 300
timeout 0
databases 16

# ── Logging ────────────────────────────────────
loglevel notice
logfile ""

# ── Slow Log (debugging) ──────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Security ───────────────────────────────────
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
