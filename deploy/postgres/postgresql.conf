# ============================================
# PostgreSQL Production Configuration
# ============================================
# Reference: https://www.postgresql.org/docs/16/runtime-config.html
#
# This file is mounted into the PostgreSQL container
# via docker-compose volumes. Place in deploy/postgres/postgresql.conf

# ── Connections ────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ── Memory ─────────────────────────────────────
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 128MB
huge_pages = try

# ── Write-Ahead Log (WAL) ─────────────────────
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
synchronous_commit = on

# ── Query Planning ─────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ── Parallelism ────────────────────────────────
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# ── Logging ────────────────────────────────────
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# ── Autovacuum ─────────────────────────────────
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 25
autovacuum_analyze_threshold = 25
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ── Timeouts ───────────────────────────────────
statement_timeout = 30s
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s

# ── SSL (uncomment when certs are configured) ──
# ssl = on
# ssl_cert_file = '/var/lib/postgresql/data/server.crt'
# ssl_key_file = '/var/lib/postgresql/data/server.key'
# ssl_ca_file = '/var/lib/postgresql/data/root.crt'
