# ============================================
# Docker Compose — Production Configuration
# ============================================
# Usage:
#   Production:  docker compose up -d
#   Local dev:   docker compose up -d (override auto-merges)
#   Build all:   docker compose build
#   Logs:        docker compose logs -f [service]
#   Migrate:     docker compose exec backend alembic upgrade head

services:
  # ── PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: t2i_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-text2img}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-text2img}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-text2img} -d ${POSTGRES_DB:-text2img}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal
    # No host port binding in production — accessed via backend only

  # ── Redis ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: t2i_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Backend (FastAPI) ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: t2i_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-text2img}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-text2img}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-text2img}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-text2img}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - frontend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Worker ──────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: t2i_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-text2img}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-text2img}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-text2img}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-text2img}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "grep -q celery /proc/1/cmdline || grep -rq celery /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    command: celery -A app.workers.celery_app worker -l info -c ${CELERY_CONCURRENCY:-2} -Q default,high_priority,celery

  # ── Next.js Frontend ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: t2i_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    networks:
      - frontend_net

  # ── Nginx Reverse Proxy ───────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: t2i_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # Uncomment for HTTPS:
      # - "443:443"
    volumes:
      # Uncomment for HTTPS:
      # - ./deploy/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  internal:
    driver: bridge
  frontend_net:
    driver: bridge
